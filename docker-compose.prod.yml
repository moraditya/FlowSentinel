version: "3.9"

# Production deployment — both services use host networking.
# Backend: sniffs the host NIC for live packet capture.
# Frontend: server-side proxy reaches backend at localhost:8000.
#
# Requirements:
#   - NIDS_API_KEY must be set (no default in production)
#   - CORS_ORIGINS must be explicit (no wildcard)
#   - cap_add: NET_ADMIN + NET_RAW for packet capture
#   - Frontend listens on PORT (default 80)

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nids-backend
    network_mode: host
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/demo:/app/demo
    environment:
      - NIDS_MODE=production
      - CORS_ORIGINS=${CORS_ORIGINS}
      - NIDS_API_KEY=${NIDS_API_KEY}
      - NIDS_CAPTURE_INTERFACE=${NIDS_CAPTURE_INTERFACE:-eth0}
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://${EC2_PUBLIC_IP}:8000
    container_name: nids-frontend
    network_mode: host
    environment:
      - NIDS_MODE=production
      - NEXT_PUBLIC_API_URL=http://${EC2_PUBLIC_IP}:8000
      - BACKEND_URL=http://localhost:8000
      - NIDS_API_KEY=${NIDS_API_KEY}
      - PORT=3000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
